name: Release

# One-button release: trigger from the Actions tab (workflow_dispatch), pick a
# bump level (or type an explicit version), and this bumps the workspace version
# + rolls the CHANGELOG, commits + tags on main, then builds and publishes a
# universal macOS binary and a native Linux x86_64 binary. A manually-pushed
# `v*` tag also builds + publishes (skipping the bump), preserving the manual
# escape hatch.

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Version bump (ignored if 'version' is set)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Explicit version without leading v (overrides bump)"
        type: string
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: write # push the bump commit + tag, create the release

jobs:
  release:
    name: Build & publish (macOS universal)
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }} # consumed by the Linux job
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the bump commit pushes cleanly

      - name: Install Rust (both macOS targets)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # On the button path, gate the release on a green tree before tagging
      # (main isn't branch-protected, so don't assume every commit passed CI).
      - name: Test gate
        if: github.event_name == 'workflow_dispatch'
        run: cargo test --workspace

      # Bump + commit + tag LOCALLY only. The push (irreversible) is deferred
      # until after the build succeeds, so a build failure leaves main and the
      # remote tags untouched — just re-dispatch.
      - name: Cut version (bump + CHANGELOG + commit + tag, local)
        id: cut
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.version || inputs.level }}
        run: |
          new=$(scripts/cut-release.sh "$BUMP")
          cargo metadata --format-version 1 >/dev/null # sync member versions in Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): v$new"
          git tag -a "v$new" -m "kommand0 v$new"
          echo "tag=v$new" >> "$GITHUB_OUTPUT"

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ steps.cut.outputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build universal binaries
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$target" --bin kommand0 --bin kmd
          done
          mkdir -p dist
          for bin in kommand0 kmd; do
            lipo -create -output "dist/$bin" \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin"
          done

      - name: Package
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          archive="kommand0-${TAG}-macos-universal.tar.gz"
          tar -C dist -czf "$archive" kommand0 kmd
          shasum -a 256 "$archive" > "$archive.sha256"

      # Build succeeded — now push the bump commit + tag (deferred from "Cut").
      - name: Push release commit + tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "$TAG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          archive="kommand0-${TAG}-macos-universal.tar.gz"
          # install.sh is platform-agnostic; ship it on the release so the
          # `curl .../releases/latest/download/install.sh | sh` one-liner works.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$archive" "$archive.sha256" scripts/install.sh \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$archive" "$archive.sha256" scripts/install.sh \
              --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi

  # Native Linux build, uploaded to the release the macOS job already created.
  # `needs: release` means it only runs once the macOS job has cut + pushed the
  # tag and created the release — so a failed macOS build never gets here, and a
  # failed Linux build just leaves the release missing its Linux asset (re-run
  # this job to add it).
  release-linux:
    name: Build & publish (Linux x86_64)
    needs: release
    # Pin to an older image (x86_64) so the shipped binary links against an
    # older glibc and runs on more distros — unlike CI, this artifact is
    # distributed, so build for max compatibility, not the newest runner.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }} # the tag the macOS job cut + pushed

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --bin kommand0 --bin kmd

      - name: Package
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          archive="kommand0-${TAG}-linux-x86_64.tar.gz"
          tar -C target/release -czf "$archive" kommand0 kmd
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          archive="kommand0-${TAG}-linux-x86_64.tar.gz"
          gh release upload "$TAG" "$archive" "$archive.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # Regenerate the Homebrew tap formula (new version + per-platform sha256) and
  # push it to the tap repo. Runs after BOTH platform assets are published, so
  # the formula's checksums always match live assets. Opt-in: it no-ops unless a
  # `HOMEBREW_TAP_TOKEN` secret (a PAT that can push to the tap) is configured —
  # see packaging/homebrew/README.md for the one-time setup.
  update-homebrew:
    name: Update Homebrew tap
    needs: [release, release-linux]
    runs-on: ubuntu-latest
    # The release itself is already published by this point; a tap hiccup
    # shouldn't mark the whole release run as failed (it stays visible to fix).
    continue-on-error: true
    steps:
      # `persist-credentials: false` is REQUIRED: otherwise actions/checkout
      # configures a global git auth header with the default GITHUB_TOKEN, which
      # overrides the PAT in our clone URL and gets a 403 pushing to the *tap*
      # repo (the GITHUB_TOKEN can't write there).
      - uses: actions/checkout@v7 # for scripts/render-homebrew-formula.sh
        with:
          persist-credentials: false

      - name: Render + push formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          TAP_REPO: cstuncsik/homebrew-tap
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping Homebrew tap update."
            exit 0
          fi
          version="${TAG#v}"
          # Pull the published checksums (avoids recomputing — single source of truth).
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.sha256' --dir sums
          mac_sha=$(cut -d' ' -f1 < "sums/kommand0-${TAG}-macos-universal.tar.gz.sha256")
          lin_sha=$(cut -d' ' -f1 < "sums/kommand0-${TAG}-linux-x86_64.tar.gz.sha256")
          scripts/render-homebrew-formula.sh "$version" "$mac_sha" "$lin_sha" > formula.rb

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp formula.rb tap/Formula/kommand0.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/kommand0.rb
          if git diff --cached --quiet; then
            echo "formula already up to date"
          else
            git commit -m "kommand0 $TAG"
            git push
          fi

name: Release

# One-button release: trigger from the Actions tab (workflow_dispatch), pick a
# bump level (or type an explicit version), and this bumps the workspace version
# + rolls the CHANGELOG, commits + tags on main, then builds and publishes a
# universal macOS binary and a native Linux x86_64 binary. A manually-pushed
# `v*` tag also builds + publishes (skipping the bump), preserving the manual
# escape hatch.

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Version bump (ignored if 'version' is set)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Explicit version without leading v (overrides bump)"
        type: string
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: write # push the bump commit + tag, create the release

jobs:
  release:
    name: Build & publish (macOS universal)
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }} # consumed by the Linux job
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the bump commit pushes cleanly

      - name: Install Rust (both macOS targets)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # On the button path, gate the release on a green tree before tagging
      # (main isn't branch-protected, so don't assume every commit passed CI).
      - name: Test gate
        if: github.event_name == 'workflow_dispatch'
        run: cargo test --workspace

      # Bump + commit + tag LOCALLY only. The push (irreversible) is deferred
      # until after the build succeeds, so a build failure leaves main and the
      # remote tags untouched — just re-dispatch.
      - name: Cut version (bump + CHANGELOG + commit + tag, local)
        id: cut
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.version || inputs.level }}
        run: |
          new=$(scripts/cut-release.sh "$BUMP")
          cargo metadata --format-version 1 >/dev/null # sync member versions in Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): v$new"
          git tag -a "v$new" -m "kommand0 v$new"
          echo "tag=v$new" >> "$GITHUB_OUTPUT"

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ steps.cut.outputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build universal binaries
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$target" --bin kommand0 --bin kmd
          done
          mkdir -p dist
          for bin in kommand0 kmd; do
            lipo -create -output "dist/$bin" \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin"
          done

      - name: Package
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          archive="kommand0-${TAG}-macos-universal.tar.gz"
          tar -C dist -czf "$archive" kommand0 kmd
          shasum -a 256 "$archive" > "$archive.sha256"

      # Build succeeded — now push the bump commit + tag (deferred from "Cut").
      - name: Push release commit + tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "$TAG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          archive="kommand0-${TAG}-macos-universal.tar.gz"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$archive" "$archive.sha256" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$archive" "$archive.sha256" \
              --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi

  # Native Linux build, uploaded to the release the macOS job already created.
  # `needs: release` means it only runs once the macOS job has cut + pushed the
  # tag and created the release — so a failed macOS build never gets here, and a
  # failed Linux build just leaves the release missing its Linux asset (re-run
  # this job to add it).
  release-linux:
    name: Build & publish (Linux x86_64)
    needs: release
    # Pin to an older image (x86_64) so the shipped binary links against an
    # older glibc and runs on more distros — unlike CI, this artifact is
    # distributed, so build for max compatibility, not the newest runner.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }} # the tag the macOS job cut + pushed

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --bin kommand0 --bin kmd

      - name: Package
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          archive="kommand0-${TAG}-linux-x86_64.tar.gz"
          tar -C target/release -czf "$archive" kommand0 kmd
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          archive="kommand0-${TAG}-linux-x86_64.tar.gz"
          gh release upload "$TAG" "$archive" "$archive.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

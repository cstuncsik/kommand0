name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Build, lint & test
    strategy:
      fail-fast: false # see both OSes' results even if one fails
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  audit:
    name: Security audit
    runs-on: ubuntu-latest # advisory DB is OS-independent — one runner suffices
    # The repo's default token is read-only, but audit-check publishes its
    # findings as a check run: without `checks: write` it 403s ("Resource not
    # accessible by integration") the moment it has anything to report, failing
    # the job for a permissions reason rather than a security one. Scoped to
    # this job so the rest of CI keeps the read-only default.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      # Scans Cargo.lock against the RustSec advisory DB; fails on a vulnerability.
      # If advisories on unrelated PRs get noisy, move this to a scheduled run.
      #
      # Pinned to a SHA rather than @v2 only because the v2 tag still declares
      # Node 20, which every run warns about. This commit is v2.0.0 plus two
      # doc changes and "Update to use Node 24" (#48): dist/index.js is
      # untouched, so the action code is identical to the tag. Move back to a
      # tag as soon as upstream cuts one that ships Node 24.
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # v2.0.0 + Node 24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

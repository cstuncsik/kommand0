name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Build, lint & test
    strategy:
      fail-fast: false # see both OSes' results even if one fails
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  audit:
    name: Security audit
    runs-on: ubuntu-latest # advisory DB is OS-independent — one runner suffices
    steps:
      - uses: actions/checkout@v7

      # Scans Cargo.lock against the RustSec advisory DB; fails on a vulnerability.
      # If advisories on unrelated PRs get noisy, move this to a scheduled run.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

[workspace]
members = ["apps/cli", "apps/tui", "crates/core"]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/cstuncsik/kommand0"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
serde_json = "1"
tempfile = "3"
chrono = "0.4"
futures = "0.3"
nix = { version = "0.30", features = ["process", "signal"] }
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2"
dirs = "6"
portable-pty = "0.9.0"
vt100 = "0.15"
kommand0-core = { path = "crates/core" }

[workspace]
members = ["apps/cli", "apps/tui", "crates/core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
serde_json = "1"
tempfile = "3"
chrono = "0.4"
futures = "0.3"
nix = { version = "0.30", features = ["process", "signal"] }
tui-textarea = "0.7"
strip-ansi-escapes = "0.2"
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2"
kommand0-core = { path = "crates/core" }
